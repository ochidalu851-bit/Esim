name: Sync country eSIM carriers and network generations

# Triggered by updates to the country dataset builder.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-country-carrier-data.yml"
      - "scripts/sync-country-carrier-data.py"
      - "server.js"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: country-carrier-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pycountry
      - name: Fetch and audit all 206 destinations
        run: python scripts/sync-country-carrier-data.py
      - name: Commit verified country data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/country-carrier-data.json public/data/country-carrier-status.json
          if git diff --cached --quiet; then
            echo "Country carrier data has not changed."
          else
            git commit -m "Refresh verified country eSIM carrier and network data"
            git push origin HEAD:main
          fi
