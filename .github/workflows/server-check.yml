name: Expert eSIM backend checks
on:
  push:
    paths:
      - "server.js"
      - "public/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/server-check.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server syntax
        run: node --check server.js
      - name: Run backend and interface tests
        run: node --test test/*.test.js
