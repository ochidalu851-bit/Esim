<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Choose an eSIM destination and browse data plans.">
<title>Expert eSIM</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#111217;--line:#242630;--muted:#8490a9;--text:#f5f6fa;--blue:#8998bb;--accent:#a6b7e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100svh;overscroll-behavior-y:contain}
button,input{font:inherit}
button{color:inherit}
.app{width:100%;max-width:760px;min-height:100svh;margin:0 auto;background:var(--bg);position:relative}
.screen{min-height:100svh;display:none;flex-direction:column}.screen#countryScreen{height:100svh;height:100dvh;min-height:0;overflow:hidden}
.screen.active{display:flex}
.country-head{position:sticky;top:0;z-index:5;background:var(--bg);padding:20px 16px 0}
.back-row{height:48px;display:flex;align-items:center}
.back{width:42px;height:42px;border:0;background:transparent;padding:0;display:grid;place-items:center;color:#f6f7fb;font-size:0}
.back svg{width:26px;height:26px;display:block}
.country-title{font-size:24px;font-weight:750;letter-spacing:-.035em;margin:20px 0 17px;line-height:1.2}
.search-wrap{height:50px;border:1px solid #242630;background:#0c0d11;border-radius:10px;display:flex;align-items:center;padding:0 13px;gap:10px;margin-bottom:12px}
.search-wrap svg{width:19px;height:19px;flex:none;color:#8e98ad}
.search-wrap input{border:0;outline:0;background:transparent;color:#f4f5f9;width:100%;font-size:13px;padding:0}
.search-wrap input::placeholder{color:#7e879a;opacity:1}
.country-list{padding:0 16px 28px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.country-row{min-height:48px;width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 18px;align-items:center;gap:9px;padding:5px 0;border:0;background:transparent;text-align:left;border-radius:9px}
.country-row:active{background:#151820}
.country-flag{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:27px;line-height:1;background:#161820;flex:none}
.country-flag.empty-flag{background:transparent}
.country-info{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.country-name{font-size:12px;font-weight:500;line-height:16px;color:#f1f2f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{width:17px;height:17px;color:#677188;justify-self:end}
.no-results{padding:20px 4px;color:#929bb0;font-size:13px}
.plan-screen{padding:0 0 100px}
.plan-head{padding:20px 16px 0}
.plan-top{height:48px;display:flex;align-items:center;justify-content:space-between}
.plan-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:64px;margin-bottom:29px}
.plan-heading h1{font-size:35px;line-height:1.1;letter-spacing:-.04em;margin:0 0 9px;font-weight:760}
.plan-country{font-size:22px;line-height:1.25;color:var(--blue);font-weight:400}
.plan-flag{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:61px;line-height:1;overflow:hidden;flex:none}
.plan-type{margin:0 16px 0;padding:4px;background:#191b20;border:1px solid #292c35;border-radius:18px;display:grid;grid-template-columns:1fr}
.plan-type button{border:0;border-radius:14px;background:#0d0f12;color:#f4f5f8;padding:16px 10px;font-size:16px;font-weight:650;box-shadow:0 0 0 1px #30343d}

.network-strip{margin:0;padding:15px 13px;border:1px solid #242630;background:#191b20;border-radius:16px;display:flex;align-items:center;gap:12px;min-height:62px}
.network-stat{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.network-stat span{font-size:13px;color:#f0f1f6;white-space:nowrap}
.network-stat strong{font-size:13px;color:#a9b5d1;font-weight:550;min-width:0;overflow-wrap:anywhere}
.network-divider{width:1px;height:27px;background:#353843;flex:none}
.plan-content{padding:0 16px;flex:1}
.plan-section{margin:82px 0 13px;color:#8490aa;font-size:14px;line-height:18px;font-weight:700;letter-spacing:.035em}
.provider-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:15px 10px;padding:4px 0 18px}
.provider-circle-item{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center}
.provider-circle{width:62px;height:62px;border-radius:50%;border:1px solid #343946;background:radial-gradient(circle at 32% 26%,#2c303b,#15171c 68%);color:#f4f6fb;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:750;letter-spacing:-.04em;cursor:pointer;transition:border-color .16s ease,background .16s ease,transform .16s ease;box-shadow:inset 0 0 0 3px #101216}
.provider-circle:active{transform:scale(.96)}
.provider-circle.connected{border:2px solid #7cc7a4;background:radial-gradient(circle at 32% 26%,#28503f,#14221c 72%);box-shadow:0 0 0 3px rgba(124,199,164,.12),inset 0 0 0 3px #111713}
.provider-circle:focus-visible{outline:2px solid #9db4ee;outline-offset:4px}
.provider-circle-name{color:#eef0f6;font-size:12px;font-weight:650;max-width:90px;overflow-wrap:anywhere}
.provider-circle-state{font-size:10px;color:#9ba5ba;min-height:13px}
.provider-circle-state.connected{color:#8bd5ad}
.provider-list-heading{margin:2px 0 14px;color:#9ba6bf;font-size:12px;letter-spacing:.07em;font-weight:750}
.provider-selection-note{margin:0 0 17px;color:#8994aa;font-size:11px;line-height:1.45}
.live-plan-list{display:grid;gap:10px;padding:0 0 100px}
.live-plan-card{border:1px solid #2a2e39;background:#15171d;border-radius:16px;padding:14px;display:grid;gap:7px}
.live-plan-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.live-plan-name{color:#f2f4f8;font-size:14px;font-weight:700}
.live-plan-meta{color:#9ca7bb;font-size:12px;line-height:1.4}
.live-plan-price{color:#c4d0ec;font-weight:750;font-size:15px;white-space:nowrap}
.live-plan-operator{color:#9eabc4;font-size:11px}
.live-plan-buy{border:1px solid #444c5d;border-radius:12px;background:#202530;color:#f4f5f8;padding:10px 13px;font-size:13px;font-weight:700}
.live-plan-buy:disabled{opacity:.5}
.plan-foot{position:fixed;bottom:0;left:0;right:0;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(9,10,13,0),#090a0d 22%);z-index:4;pointer-events:none}
.plan-foot-inner{max-width:728px;margin:0 auto;border:1px solid #242730;background:#202127;border-radius:16px;padding:15px 16px;text-align:center;color:#9ba4b6;font-size:12px;pointer-events:auto}
@media(min-width:650px){.country-head,.plan-head{padding-left:24px;padding-right:24px}.country-list{padding-left:24px;padding-right:24px}.country-title{font-size:26px}.plan-content{padding-left:24px;padding-right:24px}.plan-type{margin-left:24px;margin-right:24px}.plan-heading h1{font-size:40px}}
</style>
</head>
<body>
<div class="app">
<section class="screen active" id="countryScreen" aria-label="Select country">
  <header class="country-head">
    <div class="back-row"><button class="back" id="countryBack" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button></div>
    <h1 class="country-title">Select country</h1>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.3 16.3 4.2 4.2"/></svg>
      <input id="countrySearch" type="search" placeholder="Where do you need an eSIM?" autocomplete="off" aria-label="Where do you need an eSIM?">
    </label>
  </header>
  <main class="country-list" id="countryList" aria-live="polite"></main>
</section>

<section class="screen plan-screen" id="plansScreen" aria-label="Available data plans">
  <header class="plan-head">
    <div class="plan-top">
      <button class="back" id="plansBack" aria-label="Back to countries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
    <div class="plan-heading">
      <div>
        <h1>Available plans</h1>
        <div class="plan-country" id="selectedCountryName">United Kingdom</div>
      </div>
      <div class="plan-flag" id="selectedCountryFlag" aria-hidden="true">🇬🇧</div>
    </div>
    <div class="network-strip" aria-label="Provider and network speed">
      <div class="network-stat"><span>Provider:</span><strong id="esimProviderName">Loading providers…</strong></div>
      <span class="network-divider" aria-hidden="true"></span>
      <div class="network-stat"><span>Speed</span><strong id="networkSpeed">Checking…</strong></div>
    </div>
  </header>
  <div class="plan-type" role="tablist" aria-label="Plan type">
    <button type="button" role="tab" aria-selected="true" class="active">Data</button>
  </div>
  <main class="plan-content">
    <div class="plan-section">DATA PLANS</div>
    <div class="provider-list-heading">PROVIDERS</div>
    <div class="provider-list" id="providerList" aria-label="eSIM provider selection controls"></div>
    <p class="provider-selection-note">Connect or disconnect a provider here to choose it in Expert eSIM. This control does not switch or install an eSIM profile on your phone.</p>
    <div class="live-plan-list" id="livePlanList" aria-live="polite"></div>
  </main>
  <footer class="plan-foot">
    <div class="plan-foot-inner" id="planFooterStatus">No provider selected</div>
  </footer>
</section>
</div>
<script>
let destinations=[];
let selectedDestination=null;
let selectedProviderNames = new Set();
let loadedProviderRecords = [];
let livePlanRecords = [];
const countryList=document.getElementById('countryList');
const searchInput=document.getElementById('countrySearch');
const countryScreen=document.getElementById('countryScreen');
const plansScreen=document.getElementById('plansScreen');

const flagOverrides={
  "Afghanistan":"🇦🇫","Albania":"🇦🇱","Algeria":"🇩🇿","Andorra":"🇦🇩","Angola":"🇦🇴","Anguilla":"🇦🇮",
  "Antigua And Barbuda":"🇦🇬","Argentina":"🇦🇷","Armenia":"🇦🇲","Aruba":"🇦🇼","Australia":"🇦🇺","Austria":"🇦🇹",
  "Azerbaijan":"🇦🇿","Bahamas":"🇧🇸","Bahrain":"🇧🇭","Bangladesh":"🇧🇩","Barbados":"🇧🇧","Belarus":"🇧🇾",
  "Belgium":"🇧🇪","Belize":"🇧🇿","Benin":"🇧🇯","Bermuda":"🇧🇲","Bhutan":"🇧🇹","Bolivia":"🇧🇴","Bonaire":"🇧🇶",
  "Bosnia and Herzegovina":"🇧🇦","Botswana":"🇧🇼","Brazil":"🇧🇷","British Virgin Islands":"🇻🇬","Brunei":"🇧🇳",
  "Bulgaria":"🇧🇬","Burkina Faso":"🇧🇫","Cambodia":"🇰🇭","Cameroon":"🇨🇲","Canada":"🇨🇦","Canary Islands":"🇮🇨",
  "Cape Verde":"🇨🇻","Cayman Islands":"🇰🇾","Central African Republic":"🇨🇫","Chad":"🇹🇩","Chile":"🇨🇱",
  "China":"🇨🇳","Colombia":"🇨🇴","Costa Rica":"🇨🇷","Croatia":"🇭🇷","Curaçao":"🇨🇼","Cyprus":"🇨🇾",
  "Czech Republic":"🇨🇿","Côte d'Ivoire":"🇨🇮","Democratic Republic Of The Congo":"🇨🇩","Denmark":"🇩🇰",
  "Dominica":"🇩🇲","Dominican Republic":"🇩🇴","Ecuador":"🇪🇨","Egypt":"🇪🇬","El Salvador":"🇸🇻","Estonia":"🇪🇪",
  "Eswatini":"🇸🇿","Ethiopia":"🇪🇹","Faroe Islands":"🇫🇴","Fiji":"🇫🇯","Finland":"🇫🇮","France":"🇫🇷",
  "French Guiana":"🇬🇫","Gabon":"🇬🇦","Gambia":"🇬🇲","Georgia":"🇬🇪","Germany":"🇩🇪","Ghana":"🇬🇭",
  "Gibraltar":"🇬🇮","Greece":"🇬🇷","Greenland":"🇬🇱","Grenada":"🇬🇩","Guadeloupe":"🇬🇵","Guam":"🇬🇺",
  "Guatemala":"🇬🇹","Guinea":"🇬🇳","Guinea-Bissau":"🇬🇼","Guyana":"🇬🇾","Haiti":"🇭🇹","Honduras":"🇭🇳",
  "Hong Kong":"🇭🇰","Hungary":"🇭🇺","Iceland":"🇮🇸","India":"🇮🇳","Indonesia":"🇮🇩","Iraq":"🇮🇶",
  "Ireland":"🇮🇪","Isle of Man":"🇮🇲","Israel":"🇮🇱","Italy":"🇮🇹","Jamaica":"🇯🇲","Japan":"🇯🇵",
  "Jersey":"🇯🇪","Jordan":"🇯🇴","Kazakhstan":"🇰🇿","Kenya":"🇰🇪","Kosovo":"🇽🇰","Kuwait":"🇰🇼",
  "Kyrgyzstan":"🇰🇬","Laos":"🇱🇦","Latvia":"🇱🇻","Lebanon":"🇱🇧","Lesotho":"🇱🇸","Liberia":"🇱🇷",
  "Liechtenstein":"🇱🇮","Lithuania":"🇱🇹","Luxembourg":"🇱🇺","Macao":"🇲🇴","Madagascar":"🇲🇬","Malawi":"🇲🇼",
  "Malaysia":"🇲🇾","Maldives":"🇲🇻","Mali":"🇲🇱","Malta":"🇲🇹","Martinique":"🇲🇶","Mauritius":"🇲🇺",
  "Mayotte":"🇾🇹","Mexico":"🇲🇽","Moldova":"🇲🇩","Monaco":"🇲🇨","Mongolia":"🇲🇳","Montenegro":"🇲🇪",
  "Montserrat":"🇲🇸","Morocco":"🇲🇦","Mozambique":"🇲🇿","Nauru":"🇳🇷","Nepal":"🇳🇵","Netherlands":"🇳🇱",
  "New Zealand":"🇳🇿","Nicaragua":"🇳🇮","Niger":"🇳🇪","Nigeria":"🇳🇬","North Macedonia":"🇲🇰","Norway":"🇳🇴",
  "Oman":"🇴🇲","Pakistan":"🇵🇰","Palestine, State of":"🇵🇸","Panama":"🇵🇦","Papua New Guinea":"🇵🇬",
  "Paraguay":"🇵🇾","Peru":"🇵🇪","Philippines":"🇵🇭","Poland":"🇵🇱","Portugal":"🇵🇹","Puerto Rico":"🇵🇷",
  "Qatar":"🇶🇦","Republic of the Congo":"🇨🇬","Romania":"🇷🇴","Rwanda":"🇷🇼","Réunion":"🇷🇪",
  "Saint Barthélemy":"🇧🇱","Saint Kitts and Nevis":"🇰🇳","Saint Lucia":"🇱🇨","Saint Martin (French Part)":"🇲🇫",
  "Saint Vincent and the Grenadines":"🇻🇨","Samoa":"🇼🇸","Saudi Arabia":"🇸🇦","Senegal":"🇸🇳","Serbia":"🇷🇸",
  "Seychelles":"🇸🇨","Sierra Leone":"🇸🇱","Singapore":"🇸🇬","Sint Maarten (Dutch Part)":"🇸🇽","Slovakia":"🇸🇰",
  "Slovenia":"🇸🇮","South Africa":"🇿🇦","South Korea":"🇰🇷","Spain":"🇪🇸","Sri Lanka":"🇱🇰","Sudan":"🇸🇩",
  "Suriname":"🇸🇷","Sweden":"🇸🇪","Switzerland":"🇨🇭","Taiwan":"🇹🇼","Tajikistan":"🇹🇯","Tanzania":"🇹🇿",
  "Thailand":"🇹🇭","Timor - Leste":"🇹🇱","Togo":"🇹🇬","Tonga":"🇹🇴","Trinidad and Tobago":"🇹🇹",
  "Tunisia":"🇹🇳","Turkey":"🇹🇷","Turks and Caicos Islands":"🇹🇨","Uganda":"🇺🇬","Ukraine":"🇺🇦",
  "United Arab Emirates":"🇦🇪","United Kingdom":"🇬🇧","United States":"🇺🇸","Uruguay":"🇺🇾","Uzbekistan":"🇺🇿",
  "Vanuatu":"🇻🇺","Vatican City":"🇻🇦","Venezuela":"🇻🇪","Vietnam":"🇻🇳","Virgin Islands (U.S.)":"🇻🇮",
  "Zambia":"🇿🇲","Zimbabwe":"🇿🇼"
};
const noFlag = new Set(["Azores","Madeira","Marie-Galante","Northern Cyprus","Saba","Scotland","Sint Eustatius"]);
function flagFor(item){return flagOverrides[item.name]||""}
function escapeHtml(value){
 return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
}
function renderCountries(query=""){
 const q=query.trim().toLocaleLowerCase();
 const matches=destinations.filter(d=>d.name.toLocaleLowerCase().includes(q));
 if(!matches.length){
  countryList.innerHTML='<div class="no-results">No countries found</div>';
  return;
 }
 countryList.innerHTML=matches.map(item=>{
  const flag=flagFor(item);
  const flagClass=flag?"country-flag":"country-flag empty-flag";
  return '<button class="country-row" type="button" data-id="'+item.id+'" aria-label="Select '+escapeHtml(item.name)+'">'+
   '<span class="'+flagClass+'">'+(flag||"")+'</span>'+
   '<span class="country-info"><span class="country-name">'+escapeHtml(item.name)+'</span></span>'+
   '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>'+
   '</button>';
 }).join("");
 countryList.querySelectorAll(".country-row").forEach(row=>{
  row.addEventListener("click",()=>openPlans(Number(row.dataset.id)));
 });
}
function openPlans(id){
 selectedDestination=destinations.find(d=>d.id===id);
 if(!selectedDestination)return;
 document.getElementById("selectedCountryName").textContent=selectedDestination.name;
 document.getElementById("selectedCountryFlag").textContent=flagFor(selectedDestination);
 countryScreen.classList.remove("active");
 plansScreen.classList.add("active");
 selectedProviderNames = loadProviderSelection(selectedDestination);
 loadedProviderRecords = [];
 livePlanRecords = [];
 document.getElementById("providerList").innerHTML="";
 document.getElementById("livePlanList").innerHTML="";
 document.getElementById("planFooterStatus").textContent="No provider connected";
 window.scrollTo(0,0);
 loadNetworkInfo(selectedDestination);
}

async function loadNetworkInfo(destination){
 const provider=document.getElementById("esimProviderName");
 const speed=document.getElementById("networkSpeed");
 provider.textContent="Loading providers…";
 speed.textContent="Loading network data…";
 try{
  const response=await fetch("/api/network-info?destinationId="+encodeURIComponent(destination.id));
  const data=await response.json();
  if(!response.ok) throw new Error(data.message||"Country network information is unavailable.");
  provider.textContent=data.provider||"No source-listed eSIM provider";
  speed.textContent=Array.isArray(data.generations)&&data.generations.length?data.generations.join(" / "):"No 3G/4G/5G record";
  const carriers=Array.isArray(data.localEsimCarriers)?data.localEsimCarriers:[];
  const travel=Array.isArray(data.travelEsimProviders)?data.travelEsimProviders:[];
  const all=Array.isArray(data.esimCarriers)?data.esimCarriers:[];
  const merged=[...carriers,...travel];
  const source=merged.length?merged:all;
  const unique=new Map();
  source.forEach(item=>{
   const name=String(item.name||"").trim();
   if(name&&!unique.has(name.toLowerCase()))unique.set(name.toLowerCase(),item);
  });
  loadedProviderRecords=[...unique.values()].sort((a,b)=>a.name.localeCompare(b.name));
  renderProviderCircles();
  loadLivePlans(destination);
 }catch(error){
  provider.textContent="Source unavailable";
  speed.textContent="Source unavailable";
 }
}

function providerSelectionKey(destination){
 return "expert-esim-provider-selection:"+String(destination && (destination.code||destination.id) || "unknown");
}
function loadProviderSelection(destination){
 try{
  const values=JSON.parse(localStorage.getItem(providerSelectionKey(destination))||"[]");
  return new Set(Array.isArray(values)?values.map(value=>String(value).toLowerCase()):[]);
 }catch(error){return new Set();}
}
function saveProviderSelection(){
 if(!selectedDestination)return;
 try{
  localStorage.setItem(providerSelectionKey(selectedDestination),JSON.stringify([...selectedProviderNames]));
 }catch(error){}
}

function providerInitials(name){
 const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
 if(!parts.length)return "?";
 if(parts.length===1)return parts[0].slice(0,2).toUpperCase();
 return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}

function renderProviderCircles(){
 const grid=document.getElementById("providerList");
 if(!grid)return;
 grid.innerHTML=loadedProviderRecords.map(item=>{
  const name=String(item.name||"");
  const key=name.toLowerCase();
  const connected=selectedProviderNames.has(key);
  const providerType=item.providerType==="global_travel_esim"?"Travel eSIM":"Local carrier";
  return '<div class="provider-circle-item">'+
   '<button class="provider-circle'+(connected?' connected':'')+'" type="button" data-provider="'+escapeHtml(key)+'" aria-pressed="'+(connected?'true':'false')+'" aria-label="'+(connected?'Disconnect ':'Connect ')+escapeHtml(name)+'" title="'+(connected?'Disconnect ':'Connect ')+escapeHtml(name)+'">'+
    '<span>'+escapeHtml(providerInitials(name))+'</span></button>'+
   '<div class="provider-circle-name">'+escapeHtml(name)+'</div>'+
   '<div class="provider-circle-state'+(connected?' connected':'')+'">'+(connected?'Disconnect':'Connect')+'</div>'+
   '<div class="provider-circle-state">'+providerType+'</div>'+
  '</div>';
 }).join("");
 grid.querySelectorAll(".provider-circle").forEach(button=>{
  button.addEventListener("click",()=>{
   const key=button.dataset.provider;
   if(selectedProviderNames.has(key))selectedProviderNames.delete(key);
   else selectedProviderNames.add(key);
   saveProviderSelection();
   renderProviderCircles();
   updatePlanFooter();
  });
 });
 updatePlanFooter();
}

function updatePlanFooter(){
 const footer=document.getElementById("planFooterStatus");
 if(!footer)return;
 const names=loadedProviderRecords.filter(item=>selectedProviderNames.has(String(item.name||"").toLowerCase())).map(item=>item.name);
 footer.textContent=names.length?("Selected in Expert eSIM: "+names.join(", ")):"No provider selected";
}

async function loadLivePlans(destination){
 const list=document.getElementById("livePlanList");
 if(!list)return;
 list.innerHTML="";
 try{
  const response=await fetch("/api/plans?destinationId="+encodeURIComponent(destination.id));
  const payload=await response.json();
  livePlanRecords=Array.isArray(payload.items)?payload.items:[];
  if(!response.ok||!livePlanRecords.length)return;
  list.innerHTML=livePlanRecords.map((plan,index)=>{
   const price=plan.priceDisplay||"";
   const meta=[plan.dataAllowance,plan.validity].filter(Boolean).join(" · ");
   return '<article class="live-plan-card">'+
    '<div class="live-plan-top"><div><div class="live-plan-name">'+escapeHtml(plan.name||plan.packageId||"eSIM plan")+'</div>'+
    '<div class="live-plan-meta">'+escapeHtml(meta)+'</div></div>'+
    '<div class="live-plan-price">'+escapeHtml(price)+'</div></div>'+
    '<div class="live-plan-operator">'+escapeHtml([plan.provider,plan.operator].filter(Boolean).join(" · "))+'</div>'+
   '</article>';
  }).join("");
 }catch(error){
  livePlanRecords=[];
 }
}

function openCountryList(){
 plansScreen.classList.remove("active");
 countryScreen.classList.add("active");
 searchInput.value="";
 renderCountries("");
 window.scrollTo({top:0,behavior:"instant"});
 searchInput.blur();
}
async function init(){
 try{
  const response=await fetch("/api/destinations");
  if(!response.ok)throw new Error("Destination catalogue unavailable");
  const payload=await response.json();
  destinations=Array.isArray(payload.items)?payload.items:[];
  renderCountries("");
 }catch(error){
  countryList.innerHTML='<div class="no-results">Could not load destinations. Refresh to try again.</div>';
 }
}
searchInput.addEventListener("input",()=>renderCountries(searchInput.value));
document.getElementById("countryBack").addEventListener("click",()=>{if(history.length>1)history.back()});
document.getElementById("plansBack").addEventListener("click",openCountryList);
init();
</script>
