<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b121c">
<meta name="description" content="Expert mobile network, data bundles, app bundles, rewards and connection tools.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/geniex.css?v=1">
<title>Expert Mobile</title>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <button class="brand" data-page="home" aria-label="Expert home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3.2a16.8 16.8 0 1 0 16.8 16.8" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M20 10.1a9.9 9.9 0 1 0 9.9 9.9H20" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 20h9.9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg></span>
      <span class="brand-copy"><b>EXPERT</b><small>SMART NETWORK</small></span>
    </button>
    <div class="header-actions">
      <span class="header-status" id="headerStatus"><i></i> Checking</span>
      <button class="icon-button" data-page="help" aria-label="Help and support"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.5 1.5c-.9 1-2.1 1.3-2.1 3"/><path d="M12 17.2h.01"/></svg></button>
    </div>
  </header>
  <main id="screen" class="screen" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 17a7 7 0 0 1 14 0M8 14a4 4 0 0 1 8 0M11 11a1 1 0 0 1 2 0"/></svg><span>Home</span></button>
    <button class="nav-item" data-page="data"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h4"/></svg><span>Data</span></button>
    <button class="nav-item" data-page="apps"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v13H4V7l2-4Z"/><path d="M4 8h16M9 13h6M10 17h4"/></svg><span>Apps</span></button>
    <button class="nav-item" data-page="balance"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8.5" ry="3"/><path d="M3.5 5v5c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3V5M3.5 10v5c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3v-5M3.5 15v4c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3v-4"/></svg><span>Balance</span></button>
    <button class="nav-item" data-page="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c.7-3.7 3.4-5.7 8-5.7s7.3 2 8 5.7"/></svg><span>Account</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/geniex-app.js?v=1" defer></script>
</body>
</html>
